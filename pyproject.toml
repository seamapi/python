[project]
name = "seam"
version = "3.0.0b1"
description = "SDK for the Seam API written in Python."
authors = [{ name = "Seam Labs, Inc.", email = "engineering@getseam.com" }]
license = "MIT"
license-files = ["LICENSE.txt"]
readme = "README.rst"
requires-python = ">=3.10"
dependencies = [
    "dataclasses-json>=0.6.4,<0.7",
    "httpx>=0.28.1,<0.29",
    "httpx-retries>=0.6.0,<0.7",
    "svix>=1.24.0,<2",
]

[project.urls]
Homepage = "https://github.com/seamapi/python"
Repository = "https://github.com/seamapi/python"

[dependency-groups]
dev = [
    "black>=24.3.0,<25",
    "pylint>=3.1.0,<4",
    "pytest>=8.1.1,<9",
    "pytest-cov>=5.0.0,<6",
    "pytest-runner>=6.0.0,<7",
    "pytest-watch>=4.2.0,<5",
    "rstcheck>=6.1.2,<7",
    "mypy>=1.17.0,<2",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.8.17,<0.9.0"

[tool.uv.build-backend]
module-root = ""
source-exclude = ["**/*_test.py"]
wheel-exclude = ["**/*_test.py"]

[tool.pytest.ini_options]
norecursedirs = [
    "node_modules"
]
